<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>復習・学習スケジュール管理（リアルタイム同期版）</title>
  <!-- Firebase SDK (無料のリアルタイムデータベース) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 12px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2, h3 { margin-top: 0; color: #1a73e8; }
    .sync-bar { background: #e8f0fe; border-left: 4px solid #1a73e8; padding: 8px 12px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.9rem; }
    .btn { background: #1a73e8; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-danger { background: #d93025; }
    .btn-sm { padding: 4px 8px; font-size: 0.8rem; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-right: 8px; margin-bottom: 8px; }
    
    /* カレンダー */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-day-head { font-weight: bold; font-size: 0.8rem; color: #666; padding: 4px 0; }
    .cal-cell { background: #fafafa; border: 1px solid #eee; min-height: 80px; border-radius: 6px; padding: 2px; font-size: 0.75rem; text-align: left; }
    .cal-cell.today { background: #e8f0fe; border-color: #1a73e8; }
    .cal-date { font-weight: bold; padding: 2px 4px; color: #555; }

    /* バッジカラー */
    .badge { display: block; padding: 2px 4px; border-radius: 4px; color: white; font-size: 0.7rem; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .type-A { background: #4285f4; } /* 講義 / その他 */
    .type-B { background: #34a853; } /* 復習1 */
    .type-C { background: #fbbc05; color: #000; } /* 復習2 */
    .type-D { background: #ea4335; } /* 復習3 */

    /* ToDo リスト */
    .todo-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; }
    .todo-item.done span { text-decoration: line-through; color: #888; }
    .todo-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .shift-btns { display: flex; gap: 4px; }
  </style>
</head>
<body>

<div class="container">

  <!-- 同期設定バー -->
  <div class="sync-bar">
    <div>
      🌐 同期ID: <strong id="current-group-id">未設定</strong>
      <span id="sync-status" style="color:#34a853; font-weight:bold; margin-left:8px;">● 接続中</span>
    </div>
    <button class="btn btn-sm" onclick="changeGroupId()">同期ID変更</button>
  </div>

  <!-- タスク追加フォーム -->
  <div class="card">
    <h3>📝 タスクの追加</h3>
    <div>
      <input type="text" id="task-title" placeholder="タイトル（例: 簿記 第1講）" style="width: 200px;">
      <select id="task-type">
        <option value="cycle">【連動サイクル】講義 + 3回復習（A→B→C→D）</option>
        <option value="single">【その他】単体タスク（Aと同じ青色）</option>
      </select>
      <input type="date" id="task-date">
      <button class="btn" onclick="addTask()">追加</button>
    </div>
  </div>

  <!-- カレンダー表示 -->
  <div class="card">
    <div class="cal-header">
      <button class="btn btn-sm" onclick="moveMonth(-1)">◀ 前月</button>
      <h3 id="cal-month-title" style="margin:0;">2026年 10月</h3>
      <button class="btn btn-sm" onclick="moveMonth(1)">翌月 ▶</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- ToDo リスト -->
  <div class="card">
    <h3>✅ ToDoリスト（予定順）</h3>
    <div id="todo-list">読み込み中...</div>
  </div>

</div>

<script>
  // Firebase設定（パブリック用リアルタイムDB）
  const firebaseConfig = {
    databaseURL: "https://study-sync-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let groupId = localStorage.getItem('study_group_id');
  if (!groupId) {
    groupId = 'group-' + Math.floor(100000 + Math.random() * 900000);
    localStorage.setItem('study_group_id', groupId);
  }
  document.getElementById('current-group-id').innerText = groupId;

  function changeGroupId() {
    const input = prompt("共有・同期したい「同じ同期ID（合い言葉）」を入力してください:", groupId);
    if (input && input.trim() !== "") {
      groupId = input.trim();
      localStorage.setItem('study_group_id', groupId);
      document.getElementById('current-group-id').innerText = groupId;
      listenData();
    }
  }

  let tasks = [];
  let currentDate = new Date();

  // デフォルトの日付に今日をセット
  document.getElementById('task-date').valueAsDate = new Date();

  // リアルタイムリスナー設定
  function listenData() {
    document.getElementById('sync-status').innerText = '⏳ 読み込み中...';
    document.getElementById('sync-status').style.color = '#fbbc05';

    db.ref('tasks/' + groupId).on('value', (snapshot) => {
      const data = snapshot.val();
      tasks = data ? Object.values(data) : [];
      document.getElementById('sync-status').innerText = '● 同期完了';
      document.getElementById('sync-status').style.color = '#34a853';
      render();
    });
  }

  function saveData() {
    db.ref('tasks/' + groupId).set(tasks);
  }

  // タスク追加
  function addTask() {
    const title = document.getElementById('task-title').value.trim();
    const type = document.getElementById('task-type').value;
    const dateStr = document.getElementById('task-date').value;

    if (!title || !dateStr) {
      alert("タイトルと開始日付を入力してください。");
      return;
    }

    const baseDate = new Date(dateStr);
    const cycleId = 'cycle-' + Date.now();

    if (type === 'single') {
      tasks.push({
        id: 't-' + Date.now(),
        title: title,
        date: dateStr,
        stage: 'single', // その他
        done: false
      });
    } else {
      // 連動サイクル (A: 1日目, B: 2日目[+1d], C: 5日目[+4d], D: 14日目[+13d])
      const offsets = [
        { stage: 'A', offset: 0, label: '【講義】' },
        { stage: 'B', offset: 1, label: '【復習1】' },
        { stage: 'C', offset: 4, label: '【復習2】' },
        { stage: 'D', offset: 13, label: '【復習3】' }
      ];

      offsets.forEach(opt => {
        const d = new Date(baseDate);
        d.setDate(d.getDate() + opt.offset);
        tasks.push({
          id: 't-' + Date.now() + '-' + opt.stage,
          cycleId: cycleId,
          title: opt.label + title,
          date: d.toISOString().split('T')[0],
          stage: opt.stage,
          done: false
        });
      });
    }

    saveData();
    document.getElementById('task-title').value = '';
  }

  // チェック切り替え（完了したら表示消去/チェック）
  function toggleDone(id) {
    const t = tasks.find(x => x.id === id);
    if (t) {
      t.done = !t.done;
      saveData();
    }
  }

  // 日付のシフト（連動移動）
  function shiftTask(id, days) {
    const target = tasks.find(x => x.id === id);
    if (!target) return;

    if (target.stage === 'single' || !target.cycleId) {
      // 単体移動
      const d = new Date(target.date);
      d.setDate(d.getDate() + days);
      target.date = d.toISOString().split('T')[0];
    } else {
      // サイクル連動移動 (未消化の後続タスクを連動)
      const stages = ['A', 'B', 'C', 'D'];
      const curIdx = stages.indexOf(target.stage);
      
      const cycleTasks = tasks.filter(x => x.cycleId === target.cycleId);
      
      cycleTasks.forEach(t => {
        const tIdx = stages.indexOf(t.stage);
        if (tIdx >= curIdx && !t.done) {
          const d = new Date(t.date);
          d.setDate(d.getDate() + days);
          t.date = d.toISOString().split('T')[0];
        }
      });
    }

    saveData();
  }

  function deleteTask(id) {
    if (confirm("このタスクを削除しますか？")) {
      tasks = tasks.filter(x => x.id !== id);
      saveData();
    }
  }

  // 画面描画
  function render() {
    renderCalendar();
    renderTodoList();
  }

  function renderTodoList() {
    const listEl = document.getElementById('todo-list');
    listEl.innerHTML = '';

    // 日付順ソート
    const sorted = [...tasks].sort((a, b) => a.date.localeCompare(b.date));

    if (sorted.length === 0) {
      listEl.innerHTML = '<p style="color:#888;">登録されているタスクはありません。</p>';
      return;
    }

    sorted.forEach(t => {
      const item = document.createElement('div');
      item.className = 'todo-item' + (t.done ? ' done' : '');

      let stageClass = 'type-A';
      if (t.stage === 'B') stageClass = 'type-B';
      if (t.stage === 'C') stageClass = 'type-C';
      if (t.stage === 'D') stageClass = 'type-D';

      item.innerHTML = `
        <div class="todo-left">
          <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleDone('${t.id}')">
          <span class="badge ${stageClass}">${t.stage === 'single' ? 'その他' : t.stage}</span>
          <small style="color:#666;">${t.date}</small>
          <span>${t.title}</span>
        </div>
        <div class="shift-btns">
          <button class="btn btn-sm" style="background:#6c757d;" onclick="shiftTask('${t.id}', -1)">-1日</button>
          <button class="btn btn-sm" style="background:#6c757d;" onclick="shiftTask('${t.id}', 1)">+1日</button>
          <button class="btn btn-sm btn-danger" onclick="deleteTask('${t.id}')">✕</button>
        </div>
      `;
      listEl.appendChild(item);
    });
  }

  function moveMonth(dir) {
    currentDate.setMonth(currentDate.getMonth() + dir);
    renderCalendar();
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('cal-month-title').innerText = `${year}年 ${month + 1}月`;

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    const days = ['日', '月', '火', '水', '木', '金', '土'];
    days.forEach(d => {
      grid.innerHTML += `<div class="cal-day-head">${d}</div>`;
    });

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const todayStr = new Date().toISOString().split('T')[0];

    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div class="cal-cell" style="background:#f0f0f0;"></div>`;
    }

    for (let date = 1; date <= lastDate; date++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
      const isToday = (dateStr === todayStr);

      const dayTasks = tasks.filter(x => x.date === dateStr && !x.done);

      let taskHtml = '';
      dayTasks.forEach(t => {
        let stageClass = 'type-A';
        if (t.stage === 'B') stageClass = 'type-B';
        if (t.stage === 'C') stageClass = 'type-C';
        if (t.stage === 'D') stageClass = 'type-D';
        taskHtml += `<span class="badge ${stageClass}" title="${t.title}">${t.title}</span>`;
      });

      grid.innerHTML += `
        <div class="cal-cell ${isToday ? 'today' : ''}">
          <div class="cal-date">${date}</div>
          ${taskHtml}
        </div>
      `;
    }
  }

  // 初期化実行
  listenData();
</script>

</body>
</html>

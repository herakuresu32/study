<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勉強スケジュール＆to do リスト</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            typeA: '#2563eb', // A: 講義 / その他 (青)
            typeB: '#059669', // B: 1回目 (緑)
            typeC: '#d97706', // C: 2回目 (オレンジ)
            typeD: '#7c3aed', // D: 3回目 (紫)
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .task-card { cursor: grab; user-select: none; transition: transform 0.15s, opacity 0.15s; }
    .task-card:active { cursor: grabbing; opacity: 0.7; }
    .drag-over { background-color: rgba(37, 99, 235, 0.1) !important; border-style: dashed !important; border-color: #2563eb !important; }
  </style>

  <!-- Firebase (クラウド同期用SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDEJn3BPHLWjdKDS5cTeNIb5co4Fizuc4c",
      authDomain: "study-f5782.firebaseapp.com",
      projectId: "study-f5782",
      storageBucket: "study-f5782.firebasestorage.app",
      messagingSenderId: "180062362077",
      appId: "1:180062362077:web:d6a4d384a88e2a6bddbe34",
      measurementId: "G-KMN0MVL4QE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "study_schedules", "shared_user_schedule");

    window.FirebaseDB = {
      subscribe: (callback) => {
        return onSnapshot(docRef, (snapshot) => {
          if (snapshot.exists()) {
            callback(snapshot.data());
          } else {
            callback(null);
          }
        }, (error) => {
          console.warn("クラウド接続エラー:", error);
          window.updateSyncStatus(false);
        });
      },
      save: async (data) => {
        try {
          await setDoc(docRef, data);
          window.updateSyncStatus(true);
        } catch (e) {
          console.error("クラウド保存エラー:", e);
          window.updateSyncStatus(false);
        }
      }
    };
  </script>
</head>
<body class="antialiased min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">

  <!-- メインコンテンツ -->

          <input type="date" id="input-shift-date" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500">

  <script>
    const LOCAL_STORAGE_KEY = 'forgetting_curve_hybrid_v1';
    let appData = { lectures: [], otherTasks: [] };
    let calendarCurrentDate = new Date();
    let currentViewTab = 'todo';
    let activeShiftContext = { type: 'cycle', id: null, key: null, oldDate: null };
    let draggedTask = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadLocalData();
      if (window.FirebaseDB) {
        window.FirebaseDB.subscribe((cloudData) => {
          if (cloudData) {
            appData = cloudData;
            saveLocalData(false);
            renderCurrentView();
            window.updateSyncStatus(true);
          } else {
            syncDataToCloud();
          }
        });
      }
    });

    function updateSyncStatus(isOnline) {
      const badge = document.getElementById('sync-status-badge');
      if (isOnline) {
        badge.className = "text-[11px] text-emerald-600 font-semibold flex items-center mt-0.5";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1"></span> クラウド自動同期中`;
      } else {
        badge.className = "text-[11px] text-amber-600 font-semibold flex items-center mt-0.5";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 mr-1"></span> ローカル保存中`;
      }
    }

    function loadLocalData() {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (stored) {
        try { appData = JSON.parse(stored); } catch (e) { console.error(e); }
      }
    }

    function saveLocalData(triggerCloud = true) {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(appData));
      if (triggerCloud) syncDataToCloud();
    }

    function syncDataToCloud() {
      if (window.FirebaseDB) window.FirebaseDB.save(appData);
    }

    /* 日付ユーティリティ */
    function formatDateISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(dateStr, days) {
      const d = parseDate(dateStr);
      d.setDate(d.getDate() + Number(days));
      return formatDateISO(d);
    }

    function dateDiff(dateStr1, dateStr2) {
      return Math.round((parseDate(dateStr2) - parseDate(dateStr1)) / (1000 * 3600 * 24));
    }

    function formatDateHeader(dateStr) {
      const d = parseDate(dateStr);
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      const todayStr = formatDateISO(new Date());
      
      if (dateStr === todayStr) {
        return `${d.getDate()}日(${days[d.getDay()]})`;
      }
      return `${d.getMonth() + 1}月${d.getDate()}日(${days[d.getDay()]})`;
    }

    function generateId() {
      return 'id_' + Math.random().toString(36).substr(2, 9);
    }

    function createLectureCycle(title, category, startDateStr) {
      return {
        id: generateId(),
        title: title,
        category: category || "講義",
        blocks: {
          A: { key: 'A', label: '【A】講義', date: startDateStr, completed: false },
          B: { key: 'B', label: '【B】1回目', date: addDays(startDateStr, 1), completed: false },
          C: { key: 'C', label: '【C】2回目', date: addDays(startDateStr, 4), completed: false },
          D: { key: 'D', label: '【D】3回目', date: addDays(startDateStr, 13), completed: false }
        }
      };
    }

    function shiftCycleBlockDate(lectureId, blockKey, newDateStr) {
      const lec = appData.lectures.find(l => l.id === lectureId);
      if (!lec) return;

      const targetBlock = lec.blocks[blockKey];
      const diff = dateDiff(targetBlock.date, newDateStr);
      if (diff === 0) return;

      const keys = ['A', 'B', 'C', 'D'];
      const startIndex = keys.indexOf(blockKey);

      for (let i = startIndex; i < keys.length; i++) {
        const k = keys[i];
        if (i === startIndex || !lec.blocks[k].completed) {
          lec.blocks[k].date = addDays(lec.blocks[k].date, diff);
        }
      }
      saveLocalData();
    }

    /* タイプ別のカラー取得関数 */
    function getTaskColorClass(blockKey) {
      if (blockKey === 'B') return 'bg-emerald-600 hover:bg-emerald-700';
      if (blockKey === 'C') return 'bg-amber-600 hover:bg-amber-700';
      if (blockKey === 'D') return 'bg-purple-600 hover:bg-purple-700';
      return 'bg-blue-600 hover:bg-blue-700'; // A(講義) および その他
    }

    function switchTab(tab) {
      currentViewTab = tab;

      // タブごとの切り替え
      ['todo', 'calendar', 'lectures'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const view = document.getElementById(`view-${t}`);
        if (t === tab) {
          btn.className = "px-4 py-2 rounded-lg bg-white text-slate-900 shadow-sm font-semibold";
          view.classList.remove('hidden');
        } else {
          btn.className = "px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 font-semibold";
          view.classList.add('hidden');
        }
      });

      // トグルの表示切り替え（ToDo用/カレンダー用/講義一覧用）
      const toggleTodo = document.getElementById('toggle-container-todo');
      const toggleCal = document.getElementById('toggle-container-calendar');
      const toggleLec = document.getElementById('toggle-container-lectures');

      toggleTodo.classList.add('hidden');
      toggleCal.classList.add('hidden');
      toggleLec.classList.add('hidden');

      if (tab === 'todo') {
        toggleTodo.classList.remove('hidden');
      } else if (tab === 'calendar') {
        toggleCal.classList.remove('hidden');
      } else if (tab === 'lectures') {
        toggleLec.classList.remove('hidden');
      }

      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentViewTab === 'todo') renderToDoView();
      if (currentViewTab === 'calendar') renderCalendarView();
      if (currentViewTab === 'lectures') renderLecturesView();
    }

    /* VIEW: TODO (日付グループ化UI) */
    function renderToDoView() {
      const container = document.getElementById('todo-groups-container');
      const hideCompleted = document.getElementById('hide-completed-todo').checked;
      const todayStr = formatDateISO(new Date());

      container.innerHTML = '';
      let allTasks = [];

      appData.lectures.forEach(lec => {
        Object.keys(lec.blocks).forEach(key => {
          const b = lec.blocks[key];
          allTasks.push({
            type: 'cycle',
            id: lec.id,
            title: lec.title,
            category: lec.category,
            blockKey: key,
            date: b.date,
            completed: b.completed
          });
        });
      });

      appData.otherTasks.forEach(st => {
        allTasks.push({
          type: 'other',
          id: st.id,
          title: st.title,
          category: st.category || 'その他',
          blockKey: 'OTHER',
          date: st.date,
          completed: st.completed
        });
      });

      if (hideCompleted) allTasks = allTasks.filter(t => !t.completed);

      // 日付ごとにグループ化
      const grouped = {};
      allTasks.forEach(t => {
        if (!grouped[t.date]) grouped[t.date] = [];
        grouped[t.date].push(t);
      });

      const sortedDates = Object.keys(grouped).sort();

      if (sortedDates.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-400 py-10 font-medium">表示できるタスクはありません</div>`;
        return;
      }

      sortedDates.forEach(dateStr => {
        const groupEl = document.createElement('div');
        groupEl.className = "space-y-2";

        const isToday = dateStr === todayStr;
        const headerTitle = formatDateHeader(dateStr);

        groupEl.innerHTML = `
          <div class="flex justify-between items-center px-1">
            <h3 class="text-lg font-bold text-slate-800 flex items-center">
              ${headerTitle}
              ${isToday ? '<span class="ml-2 text-xs bg-blue-600 text-white px-2 py-0.5 rounded-full font-bold shadow-sm">今日</span>' : ''}
            </h3>
            ${isToday ? `
              <button onclick="openNewOtherModal()" class="w-8 h-8 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center font-bold shadow-sm transition">
                <i class="fa-solid fa-plus"></i>
              </button>
            ` : ''}
          </div>
          <div class="space-y-2 drop-zone p-1 rounded-2xl min-h-[50px] transition" data-date="${dateStr}">
          </div>
        `;

        const cardsContainer = groupEl.querySelector('.drop-zone');

        cardsContainer.addEventListener('dragover', (e) => {
          e.preventDefault();
          cardsContainer.classList.add('drag-over');
        });
        cardsContainer.addEventListener('dragleave', () => {
          cardsContainer.classList.remove('drag-over');
        });
        cardsContainer.addEventListener('drop', (e) => {
          e.preventDefault();
          cardsContainer.classList.remove('drag-over');
          if (draggedTask) {
            handleTaskDrop(draggedTask, dateStr);
          }
        });

        grouped[dateStr].forEach(task => {
          const colorClass = getTaskColorClass(task.blockKey);

          const card = document.createElement('div');
          card.draggable = true;
          card.className = `task-card ${colorClass} text-white font-semibold px-4 py-3 rounded-full flex items-center justify-between shadow-sm transition ${
            task.completed ? 'opacity-40 bg-slate-400 text-slate-100' : ''
          }`;

          card.innerHTML = `
            <div class="flex items-center space-x-3 truncate flex-1 cursor-pointer" onclick="toggleTaskStatus('${task.type}', '${task.id}', '${task.blockKey}')">
              <div class="w-5 h-5 rounded-full border-2 border-white/80 flex items-center justify-center text-xs flex-shrink-0 ${task.completed ? 'bg-white text-slate-800 border-white' : ''}">
                ${task.completed ? '<i class="fa-solid fa-check"></i>' : ''}
              </div>
              <span class="truncate text-sm tracking-wide">
                ${task.category ? `<span class="opacity-90 font-normal mr-2">${escapeHTML(task.category)}</span>` : ''}
                ${escapeHTML(task.title)}
              </span>
            </div>
            <button onclick="event.stopPropagation(); openShiftModal('${task.type}', '${task.id}', '${task.blockKey}')" class="text-white/80 hover:text-white p-1 ml-2">
              <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
            </button>
          `;

          card.addEventListener('dragstart', () => { draggedTask = task; });
          card.addEventListener('dragend', () => { draggedTask = null; });

          cardsContainer.appendChild(card);
        });

        container.appendChild(groupEl);
      });
    }

    function handleTaskDrop(task, targetDate) {
      if (task.type === 'cycle') {
        shiftCycleBlockDate(task.id, task.blockKey, targetDate);
      } else {
        const st = appData.otherTasks.find(t => t.id === task.id);
        if (st) {
          st.date = targetDate;
          saveLocalData();
        }
      }
      renderCurrentView();
    }

    function toggleTaskStatus(type, id, blockKey) {
      if (type === 'cycle') {
        const lec = appData.lectures.find(l => l.id === id);
        if (lec && lec.blocks[blockKey]) lec.blocks[blockKey].completed = !lec.blocks[blockKey].completed;
      } else {
        const st = appData.otherTasks.find(t => t.id === id);
        if (st) st.completed = !st.completed;
      }
      saveLocalData();
      renderCurrentView();
    }

    function renderCalendarView() {
      const year = calendarCurrentDate.getFullYear();
      const month = calendarCurrentDate.getMonth();
      const hideCompleted = document.getElementById('hide-completed-calendar').checked;

      document.getElementById('calendar-month-year').innerText = `${year}年 ${month + 1}月`;
      const grid = document.getElementById('calendar-days-grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const todayStr = formatDateISO(new Date());

      let calendarMap = {};

      appData.lectures.forEach(lec => {
        Object.keys(lec.blocks).forEach(key => {
          const b = lec.blocks[key];
          if (hideCompleted && b.completed) return;
          if (!calendarMap[b.date]) calendarMap[b.date] = [];
          calendarMap[b.date].push({ type: 'cycle', id: lec.id, title: lec.title, key: key, completed: b.completed });
        });
      });

      appData.otherTasks.forEach(st => {
        if (hideCompleted && st.completed) return;
        if (!calendarMap[st.date]) calendarMap[st.date] = [];
        calendarMap[st.date].push({ type: 'other', id: st.id, title: st.title, key: 'OTHER', completed: st.completed });
      });

      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'min-h-[80px] p-1 bg-slate-50/50 text-slate-300 text-xs';
        grid.appendChild(cell);
      }

      for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;
        const tasks = calendarMap[dateStr] || [];

        const cell = document.createElement('div');
        cell.className = `min-h-[80px] p-1 border-t border-slate-100 transition drop-zone ${isToday ? 'bg-blue-50/40' : ''}`;
        cell.setAttribute('data-date', dateStr);

        cell.addEventListener('dragover', (e) => { e.preventDefault(); cell.classList.add('drag-over'); });
        cell.addEventListener('dragleave', () => { cell.classList.remove('drag-over'); });
        cell.addEventListener('drop', (e) => {
          e.preventDefault();
          cell.classList.remove('drag-over');
          if (draggedTask) handleTaskDrop(draggedTask, dateStr);
        });

        let badgesHTML = tasks.map(t => {
          const colorClass = getTaskColorClass(t.key);
          return `
            <div onclick="openShiftModal('${t.type}', '${t.id}', '${t.key}')" class="text-[10px] truncate rounded px-1.5 py-0.5 text-white ${colorClass} mb-1 cursor-pointer font-medium ${t.completed ? 'opacity-40 line-through' : ''}">
              ${escapeHTML(t.title)}
            </div>
          `;
        }).join('');

        cell.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold ${isToday ? 'w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center' : 'text-slate-700'}">${day}</span>
          </div>
          <div class="space-y-0.5 max-h-14 overflow-y-auto">${badgesHTML}</div>
        `;
        grid.appendChild(cell);
      }
    }

    function changeCalendarMonth(delta) {
      calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + delta);
      renderCalendarView();
    }

    function resetCalendarToToday() {
      calendarCurrentDate = new Date();
      renderCalendarView();
    }

    function renderLecturesView() {
      const container = document.getElementById('lecture-cards-container');
      const hideCompleted = document.getElementById('hide-completed-lectures').checked;
      container.innerHTML = '';

      if (appData.lectures.length === 0) {
        container.innerHTML = '<p class="col-span-full text-center text-slate-400 py-8 font-medium">登録された講義サイクルがありません。</p>';
        return;
      }

      let displayedLectures = appData.lectures;

      // 「全ステップ完了」の講義サイクルを隠す設定
      if (hideCompleted) {
        displayedLectures = displayedLectures.filter(lec => {
          const keys = Object.keys(lec.blocks);
          return !keys.every(k => lec.blocks[k].completed);
        });
      }

      if (displayedLectures.length === 0) {
        container.innerHTML = '<p class="col-span-full text-center text-slate-400 py-8 font-medium">表示できる講義はありません（すべて完了済み）</p>';
        return;
      }

      displayedLectures.forEach(lec => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl border border-slate-200 p-4 space-y-3 shadow-sm';

        let blocksHTML = ['A', 'B', 'C', 'D'].map(k => {
          const b = lec.blocks[k];
          if (!b) return '';
          return `
            <div class="flex items-center justify-between text-xs py-1.5 border-b border-slate-100 last:border-0">
              <span class="text-slate-700 font-medium">${b.label}: ${formatDateHeader(b.date)}</span>
              <div class="flex items-center space-x-2">
                ${b.completed ? '<span class="text-emerald-600 font-bold"><i class="fa-solid fa-check mr-0.5"></i>完了</span>' : '<span class="text-slate-400">未処理</span>'}
                <button onclick="openShiftModal('cycle', '${lec.id}', '${k}')" class="text-blue-600 hover:underline">変更</button>
              </div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-bold inline-block mb-1">${escapeHTML(lec.category)}</span>
              <h3 class="font-bold text-slate-900 text-sm">${escapeHTML(lec.title)}</h3>
            </div>
            <button onclick="deleteLectureCycle('${lec.id}')" class="text-slate-300 hover:text-red-500 p-1 transition"><i class="fa-solid fa-trash-can text-xs"></i></button>
          </div>
          <div class="bg-slate-50 rounded-xl p-2.5 space-y-1">${blocksHTML}</div>
        `;
        container.appendChild(card);
      });
    }

    function deleteLectureCycle(id) {
      if (confirm('この講義サイクルを完全削除しますか？')) {
        appData.lectures = appData.lectures.filter(l => l.id !== id);
        saveLocalData();
        renderCurrentView();
      }
    }

    /* モーダル＆アクション */
    function openNewLectureModal() {
      document.getElementById('form-lecture').reset();
      document.getElementById('input-date').value = formatDateISO(new Date());
      openModal('modal-lecture');
    }

    function saveNewLecture(e) {
      e.preventDefault();
      const title = document.getElementById('input-title').value.trim();
      const category = document.getElementById('input-category').value.trim() || '講義';
      const startDate = document.getElementById('input-date').value;

      if (!title || !startDate) return;

      const newLec = createLectureCycle(title, category, startDate);
      appData.lectures.unshift(newLec);
      saveLocalData();
      closeModal('modal-lecture');
      renderCurrentView();
    }

    function openNewOtherModal() {
      document.getElementById('form-other').reset();
      document.getElementById('input-other-date').value = formatDateISO(new Date());
      openModal('modal-other');
    }

    function saveNewOtherTask(e) {
      e.preventDefault();
      const title = document.getElementById('input-other-title').value.trim();
      const date = document.getElementById('input-other-date').value;

      if (!title || !date) return;

      appData.otherTasks.unshift({
        id: generateId(),
        title: title,
        category: 'その他',
        date: date,
        completed: false
      });

      saveLocalData();
      closeModal('modal-other');
      renderCurrentView();
    }

    function openShiftModal(type, id, blockKey) {
      activeShiftContext = { type, id, key: blockKey };

      if (type === 'cycle') {
        const lec = appData.lectures.find(l => l.id === id);
        if (!lec) return;
        const b = lec.blocks[blockKey];
        activeShiftContext.oldDate = b.date;

        document.getElementById('modal-shift-info').innerHTML = `
          <div class="font-bold text-slate-900">${escapeHTML(lec.title)}</div>
          <div class="text-xs text-blue-800 mt-1">現在: ${formatDateHeader(b.date)}</div>
        `;
        document.getElementById('input-shift-date').value = b.date;
      } else {
        const st = appData.otherTasks.find(t => t.id === id);
        if (!st) return;
        activeShiftContext.oldDate = st.date;

        document.getElementById('modal-shift-info').innerHTML = `
          <div class="font-bold text-slate-900">${escapeHTML(st.title)}</div>
          <div class="text-xs text-blue-800 mt-1">現在: ${formatDateHeader(st.date)}</div>
        `;
        document.getElementById('input-shift-date').value = st.date;
      }
      openModal('modal-shift');
    }

    function shiftQuickOffset(days) {
      const current = document.getElementById('input-shift-date').value || activeShiftContext.oldDate;
      document.getElementById('input-shift-date').value = addDays(current, days);
    }

    function saveShiftAction() {
      const newDate = document.getElementById('input-shift-date').value;
      if (!newDate) return;

      if (activeShiftContext.type === 'cycle') {
        shiftCycleBlockDate(activeShiftContext.id, activeShiftContext.key, newDate);
      } else {
        const st = appData.otherTasks.find(t => t.id === activeShiftContext.id);
        if (st) st.date = newDate;
        saveLocalData();
      }
      closeModal('modal-shift');
      renderCurrentView();
    }

    function deleteCurrentTask() {
      if (confirm('このタスクを削除しますか？')) {
        if (activeShiftContext.type === 'other') {
          appData.otherTasks = appData.otherTasks.filter(t => t.id !== activeShiftContext.id);
        } else {
          const lec = appData.lectures.find(l => l.id === activeShiftContext.id);
          if (lec) delete lec.blocks[activeShiftContext.key];
        }
        saveLocalData();
        closeModal('modal-shift');
        renderCurrentView();
      }
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&#34;' }[tag] || tag));
    }
  </script>
</body>
</html>

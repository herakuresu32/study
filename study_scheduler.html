<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            typeA: '#2563eb', // A: 講義 / その他
            typeB: '#059669', // B: 1回目
            typeC: '#d97706', // C: 2回目
            typeD: '#7c3aed', // D: 3回目
          }
        }
      }

  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }

  <!-- Firebase (クラウド同期用SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 💡 ご自身のFirebaseプロジェクトの設定値に書き換えることで、ご専用のクラウドストレージになります
    // (現在はデモ用共有DBに接続する設定にしています)
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyForForgettingCurveApp12345",
      authDomain: "forgetting-curve-app.firebaseapp.com",
      projectId: "forgetting-curve-app",
      storageBucket: "forgetting-curve-app.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    // Firebaseの初期化
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 同期用の固定ドキュメントID (※複数人で部屋分けしたい場合はここを変更)
    const docRef = doc(db, "study_schedules", "shared_user_schedule");

    window.FirebaseDB = {
      // クラウドデータのリアルタイム受信登録
      subscribe: (callback) => {
        return onSnapshot(docRef, (snapshot) => {
          if (snapshot.exists()) {
            callback(snapshot.data());
          } else {
            callback(null);
          }
        }, (error) => {
          console.warn("クラウド接続に失敗しました。ローカルストレージに切り替えます。", error);
          window.updateSyncStatus(false);
        });
      },
      // クラウドへデータの保存
      save: async (data) => {
        try {
          await setDoc(docRef, data);
          window.updateSyncStatus(true);
        } catch (e) {
          console.error("クラウド保存エラー:", e);
          window.updateSyncStatus(false);
        }
      }
    };
  </script>
</head>

  <script>
    const LOCAL_STORAGE_KEY = 'forgetting_curve_hybrid_v1';

    let appData = {
      lectures: [],
      otherTasks: []
    };

    let calendarCurrentDate = new Date();
    let currentViewTab = 'todo';
    let activeShiftContext = { type: 'cycle', id: null, key: null, oldDate: null };

    window.addEventListener('DOMContentLoaded', () => {
      // ローカルデータ読み込み（フォールバック用）
      loadLocalData();
      
      // Firebase クラウド同期の設定
      if (window.FirebaseDB) {
        window.FirebaseDB.subscribe((cloudData) => {
          if (cloudData) {
            appData = cloudData;
            saveLocalData(false); // ローカルにもキャッシュ
            renderCurrentView();
            window.updateSyncStatus(true);
          } else {
            // 初回クラウド保存
            syncDataToCloud();
          }
        });
      }
    });

    function updateSyncStatus(isOnline) {
      const badge = document.getElementById('sync-status-badge');
      if (isOnline) {
        badge.className = "inline-flex items-center text-emerald-600 font-semibold";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span> クラウド自動同期中`;
      } else {
        badge.className = "inline-flex items-center text-amber-600 font-semibold";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 mr-1.5"></span> 端末内ローカル保存中`;
      }
    }

    function loadLocalData() {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (stored) {
        try {
          appData = JSON.parse(stored);
        } catch (e) {
          console.error(e);
        }
      }
    }

    function saveLocalData(triggerCloud = true) {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(appData));
      if (triggerCloud) {
        syncDataToCloud();
      }
    }

    function syncDataToCloud() {
      if (window.FirebaseDB) {
        window.FirebaseDB.save(appData);
      }
    }

    /* Date Utilities */
    function formatDateISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(dateStr, days) {
      const d = parseDate(dateStr);
      d.setDate(d.getDate() + Number(days));
      return formatDateISO(d);
    }

    function dateDiff(dateStr1, dateStr2) {
      const d1 = parseDate(dateStr1);
      const d2 = parseDate(dateStr2);
      return Math.round((d2 - d1) / (1000 * 3600 * 24));
    }

    function formatDateJP(dateStr) {
      const d = parseDate(dateStr);
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      return `${d.getMonth() + 1}月${d.getDate()}日(${days[d.getDay()]})`;
    }

    function generateId() {
      return 'id_' + Math.random().toString(36).substr(2, 9);
    }

    /* Cycle Factory */
    function createLectureCycle(title, category, startDateStr) {
      return {
        id: generateId(),
        title: title,
        category: category || "講義",
        blocks: {
          A: { key: 'A', label: '【A】講義受講', date: startDateStr, completed: false },
          B: { key: 'B', label: '【B】1回目復習', date: addDays(startDateStr, 1), completed: false },
          C: { key: 'C', label: '【C】2回目復習', date: addDays(startDateStr, 4), completed: false },
          D: { key: 'D', label: '【D】3回目復習', date: addDays(startDateStr, 13), completed: false }
        }
      };
    }

    /* 追従スライドエンジン */
    function shiftCycleBlockDate(lectureId, blockKey, newDateStr) {
      const lec = appData.lectures.find(l => l.id === lectureId);
      if (!lec) return;

      const targetBlock = lec.blocks[blockKey];
      const diff = dateDiff(targetBlock.date, newDateStr);

      if (diff === 0) return;

      const keys = ['A', 'B', 'C', 'D'];
      const startIndex = keys.indexOf(blockKey);

      for (let i = startIndex; i < keys.length; i++) {
        const k = keys[i];
        if (i === startIndex || !lec.blocks[k].completed) {
          lec.blocks[k].date = addDays(lec.blocks[k].date, diff);
        }
      }

      saveLocalData();
    }

    function switchTab(tab) {
      currentViewTab = tab;
      ['todo', 'calendar', 'lectures'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const view = document.getElementById(`view-${t}`);
        if (t === tab) {
          btn.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
          btn.classList.remove('text-slate-600');
          view.classList.remove('hidden');
        } else {
          btn.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
          btn.classList.add('text-slate-600');
          view.classList.add('hidden');
        }
      });

      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentViewTab === 'todo') renderToDoView();
      if (currentViewTab === 'calendar') renderCalendarView();
      if (currentViewTab === 'lectures') renderLecturesView();
    }

    function renderToDoView() {
      const container = document.getElementById('todo-list-container');
      const hideCompleted = document.getElementById('hide-completed-toggle').checked;
      const searchKeyword = (document.getElementById('search-keyword').value || '').toLowerCase().trim();
      const todayStr = formatDateISO(new Date());

      container.innerHTML = '';

      let allTasks = [];

      appData.lectures.forEach(lec => {
        Object.keys(lec.blocks).forEach(key => {
          const block = lec.blocks[key];
          allTasks.push({
            type: 'cycle',
            id: lec.id,
            title: lec.title,
            category: lec.category,
            blockKey: key,
            date: block.date,
            completed: block.completed,
            isOverdue: block.date < todayStr && !block.completed
          });
        });
      });

      appData.otherTasks.forEach(st => {
        allTasks.push({
          type: 'other',
          id: st.id,
          title: st.title,
          category: 'その他',
          blockKey: 'OTHER',
          date: st.date,
          completed: st.completed,
          isOverdue: st.date < todayStr && !st.completed
        });
      });

      allTasks.sort((a, b) => a.date.localeCompare(b.date));

      const uncompletedCount = allTasks.filter(t => !t.completed).length;
      document.getElementById('todo-badge').innerText = uncompletedCount;
      document.getElementById('todo-summary').innerText = `残タスク: ${uncompletedCount}件`;

      let filteredTasks = allTasks;
      if (hideCompleted) filteredTasks = filteredTasks.filter(t => !t.completed);
      if (searchKeyword) {
        filteredTasks = filteredTasks.filter(t => 
          t.title.toLowerCase().includes(searchKeyword) || 
          t.category.toLowerCase().includes(searchKeyword)
        );
      }

      if (filteredTasks.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 shadow-sm">
            <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-3 text-xl">
              <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="font-bold text-slate-800">表示できるタスクはありません</h3>
          </div>
        `;
        return;
      }

      filteredTasks.forEach(item => {
        const isToday = item.date === todayStr;

        const card = document.createElement('div');
        card.className = `bg-white rounded-xl p-3.5 border transition flex items-center justify-between gap-3 shadow-sm ${
          item.completed ? 'opacity-50 bg-slate-50 border-slate-200' : item.isOverdue ? 'border-amber-300 bg-amber-50/40' : 'border-slate-200 hover:border-blue-300'
        }`;

        card.innerHTML = `
          <div class="flex items-center space-x-3 flex-1 min-w-0">
            <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleTaskStatus('${item.type}', '${item.id}', '${item.blockKey}')" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
            <div class="min-w-0 flex-1">
              <div class="flex items-center space-x-2 flex-wrap gap-y-1 mb-0.5">
                ${getBlockBadgeHTML(item.blockKey)}
                <span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-medium">${escapeHTML(item.category)}</span>
                <span class="text-xs font-bold text-slate-500">${formatDateJP(item.date)}</span>
                ${isToday ? '<span class="text-[10px] font-bold bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded">今日</span>' : ''}
                ${item.isOverdue ? '<span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded">遅れ</span>' : ''}
              </div>
              <h4 class="font-bold text-sm text-slate-900 truncate ${item.completed ? 'line-through text-slate-500' : ''}">${escapeHTML(item.title)}</h4>
            </div>
          </div>

          <div class="flex items-center space-x-1">
            <button onclick="quickDirectShift('${item.type}', '${item.id}', '${item.blockKey}', 1)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-semibold transition" title="+1日延期">+1日</button>
            <button onclick="openShiftModal('${item.type}', '${item.id}', '${item.blockKey}')" class="px-2.5 py-1.5 text-xs text-slate-600 hover:text-blue-600 hover:bg-slate-100 rounded-lg transition font-medium">
              <i class="fa-regular fa-calendar-minus mr-1"></i> 変更
            </button>
            <button onclick="deleteSingleOrTask('${item.type}', '${item.id}', '${item.blockKey}')" class="p-1.5 text-slate-300 hover:text-red-500 rounded-lg">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function quickDirectShift(type, id, blockKey, days) {
      if (type === 'cycle') {
        const lec = appData.lectures.find(l => l.id === id);
        if (lec && lec.blocks[blockKey]) {
          const newDate = addDays(lec.blocks[blockKey].date, days);
          shiftCycleBlockDate(id, blockKey, newDate);
        }
      } else {
        const st = appData.otherTasks.find(t => t.id === id);
        if (st) {
          st.date = addDays(st.date, days);
          saveLocalData();
        }
      }
      renderCurrentView();
    }

    function toggleTaskStatus(type, id, blockKey) {
      if (type === 'cycle') {
        const lec = appData.lectures.find(l => l.id === id);
        if (lec && lec.blocks[blockKey]) {
          lec.blocks[blockKey].completed = !lec.blocks[blockKey].completed;
        }
      } else {
        const st = appData.otherTasks.find(t => t.id === id);
        if (st) {
          st.completed = !st.completed;
        }
      }
      saveLocalData();
      renderCurrentView();
    }

    function deleteSingleOrTask(type, id, blockKey) {
      if (type === 'other') {
        if (confirm('この「その他」タスクを削除しますか？')) {
          appData.otherTasks = appData.otherTasks.filter(t => t.id !== id);
          saveLocalData();
          renderCurrentView();
        }
      } else {
        if (confirm(`この講義ステップ【${blockKey}】を削除しますか？`)) {
          const lec = appData.lectures.find(l => l.id === id);
          if (lec) {
            delete lec.blocks[blockKey];
            saveLocalData();
            renderCurrentView();
          }
        }
      }
    }

    function renderCalendarView() {
      const year = calendarCurrentDate.getFullYear();
      const month = calendarCurrentDate.getMonth();
      const hideCompleted = document.getElementById('hide-completed-toggle').checked;

      document.getElementById('calendar-month-year').innerText = `${year}年 ${month + 1}月`;

      const grid = document.getElementById('calendar-days-grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const todayStr = formatDateISO(new Date());

      let calendarMap = {};

      appData.lectures.forEach(lec => {
        Object.keys(lec.blocks).forEach(key => {
          const b = lec.blocks[key];
          if (hideCompleted && b.completed) return;

          if (!calendarMap[b.date]) calendarMap[b.date] = [];
          calendarMap[b.date].push({
            type: 'cycle',
            id: lec.id,
            title: lec.title,
            key: key,
            completed: b.completed
          });
        });
      });

      appData.otherTasks.forEach(st => {
        if (hideCompleted && st.completed) return;

        if (!calendarMap[st.date]) calendarMap[st.date] = [];
        calendarMap[st.date].push({
          type: 'other',
          id: st.id,
          title: st.title,
          key: 'OTHER',
          completed: st.completed
        });
      });

      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'min-h-[90px] p-1 bg-slate-50/50 text-slate-300 text-xs';
        grid.appendChild(cell);
      }

      for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;
        const tasks = calendarMap[dateStr] || [];

        const cell = document.createElement('div');
        cell.className = `min-h-[90px] p-1 border-t border-slate-100 transition ${isToday ? 'bg-blue-50/40' : ''}`;

        let badgesHTML = tasks.map(t => {
          let colorClass = 'bg-blue-600';
          let label = t.key === 'OTHER' ? 'その他' : t.key;
          if (t.key === 'B') colorClass = 'bg-emerald-600';
          if (t.key === 'C') colorClass = 'bg-amber-600';
          if (t.key === 'D') colorClass = 'bg-purple-600';

          return `
            <div onclick="openShiftModal('${t.type}', '${t.id}', '${t.key}')" class="text-[10px] truncate rounded px-1 py-0.5 text-white font-medium mb-1 cursor-pointer ${colorClass} ${t.completed ? 'opacity-40 line-through' : 'hover:opacity-80'}">
              ${label}: ${escapeHTML(t.title)}
            </div>
          `;
        }).join('');

        cell.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold ${isToday ? 'w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center' : 'text-slate-700'}">${day}</span>
            ${tasks.length > 0 ? `<span class="text-[10px] text-slate-400 font-semibold">${tasks.length}</span>` : ''}
          </div>
          <div class="space-y-0.5 max-h-16 overflow-y-auto">${badgesHTML}</div>
        `;

        grid.appendChild(cell);
      }
    }

    function changeCalendarMonth(delta) {
      calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + delta);
      renderCalendarView();
    }

    function resetCalendarToToday() {
      calendarCurrentDate = new Date();
      renderCalendarView();
    }

    function renderLecturesView() {
      const container = document.getElementById('lecture-cards-container');
      container.innerHTML = '';

      if (appData.lectures.length === 0) {
        container.innerHTML = '<p class="col-span-full text-center text-slate-400 py-8">登録された講義サイクルがありません。</p>';
        return;
      }

      appData.lectures.forEach(lec => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4';

        let blocksHTML = ['A', 'B', 'C', 'D'].map(k => {
          const b = lec.blocks[k];
          if (!b) return '';
          return `
            <div class="flex items-center justify-between text-xs py-2 border-b border-slate-100 last:border-0">
              <div class="flex items-center space-x-2">
                ${getBlockBadgeHTML(k)}
                <span class="font-semibold text-slate-700">${formatDateJP(b.date)}</span>
              </div>
              <div class="flex items-center space-x-2">
                ${b.completed ? '<span class="text-emerald-600 font-bold"><i class="fa-solid fa-check"></i> 完了</span>' : '<span class="text-slate-400">未処理</span>'}
                <button onclick="openShiftModal('cycle', '${lec.id}', '${k}')" class="text-blue-600 hover:underline">変更</button>
              </div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-bold mb-1 inline-block">${escapeHTML(lec.category)}</span>
              <h3 class="font-bold text-slate-900 text-base">${escapeHTML(lec.title)}</h3>
            </div>
            <button onclick="deleteLectureCycle('${lec.id}')" class="text-slate-300 hover:text-red-500 p-1"><i class="fa-solid fa-trash-can"></i></button>
          </div>
          <div class="bg-slate-50 rounded-xl p-3 space-y-1">${blocksHTML}</div>
        `;

        container.appendChild(card);
      });
    }

    function deleteLectureCycle(id) {
      if (confirm('この講義と全復習サイクル（A, B, C, D）を完全削除しますか？')) {
        appData.lectures = appData.lectures.filter(l => l.id !== id);
        saveLocalData();
        renderCurrentView();
      }
    }

    /* Modals & Actions */
    function openNewLectureModal() {
      document.getElementById('form-lecture').reset();
      document.getElementById('input-date').value = formatDateISO(new Date());
      openModal('modal-lecture');
    }

    function saveNewLecture(e) {
      e.preventDefault();
      const title = document.getElementById('input-title').value.trim();
      const category = document.getElementById('input-category').value.trim() || '講義';
      const startDate = document.getElementById('input-date').value;

      if (!title || !startDate) return;

      const newLec = createLectureCycle(title, category, startDate);
      appData.lectures.unshift(newLec);
      saveLocalData();

      closeModal('modal-lecture');
      renderCurrentView();
    }

    function openNewOtherModal() {
      document.getElementById('form-other').reset();
      document.getElementById('input-other-date').value = formatDateISO(new Date());
      openModal('modal-other');
    }

    function saveNewOtherTask(e) {
      e.preventDefault();
      const title = document.getElementById('input-other-title').value.trim();
      const date = document.getElementById('input-other-date').value;

      if (!title || !date) return;

      appData.otherTasks.unshift({
        id: generateId(),
        title: title,
        category: 'その他',
        date: date,
        completed: false
      });

      saveLocalData();
      closeModal('modal-other');
      renderCurrentView();
    }

    function openShiftModal(type, id, blockKey) {
      activeShiftContext = { type, id, key: blockKey };

      if (type === 'cycle') {
        const lec = appData.lectures.find(l => l.id === id);
        if (!lec) return;
        const b = lec.blocks[blockKey];
        activeShiftContext.oldDate = b.date;

        document.getElementById('modal-shift-info').innerHTML = `
          <div class="font-bold text-slate-900">${escapeHTML(lec.title)}</div>
          <div class="text-xs text-blue-800 mt-1">対象: ${getBlockBadgeHTML(blockKey)} (現在: ${formatDateJP(b.date)})</div>
        `;
        document.getElementById('shift-cascade-warning').classList.remove('hidden');
        document.getElementById('input-shift-date').value = b.date;
      } else {
        const st = appData.otherTasks.find(t => t.id === id);
        if (!st) return;
        activeShiftContext.oldDate = st.date;

        document.getElementById('modal-shift-info').innerHTML = `
          <div class="font-bold text-slate-900">${escapeHTML(st.title)}</div>
          <div class="text-xs text-blue-800 mt-1">その他 (現在: ${formatDateJP(st.date)})</div>
        `;
        document.getElementById('shift-cascade-warning').classList.add('hidden');
        document.getElementById('input-shift-date').value = st.date;
      }

      openModal('modal-shift');
    }

    function shiftQuickOffset(days) {
      const current = document.getElementById('input-shift-date').value || activeShiftContext.oldDate;
      document.getElementById('input-shift-date').value = addDays(current, days);
    }

    function saveShiftAction() {
      const newDate = document.getElementById('input-shift-date').value;
      if (!newDate) return;

      if (activeShiftContext.type === 'cycle') {
        shiftCycleBlockDate(activeShiftContext.id, activeShiftContext.key, newDate);
      } else {
        const st = appData.otherTasks.find(t => t.id === activeShiftContext.id);
        if (st) st.date = newDate;
        saveLocalData();
      }

      closeModal('modal-shift');
      renderCurrentView();
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function getBlockBadgeHTML(key) {
      if (key === 'A') return '<span class="bg-blue-600 text-white font-bold text-[10px] px-1.5 py-0.5 rounded">A:講義</span>';
      if (key === 'B') return '<span class="bg-emerald-600 text-white font-bold text-[10px] px-1.5 py-0.5 rounded">B:1回目</span>';
      if (key === 'C') return '<span class="bg-amber-600 text-white font-bold text-[10px] px-1.5 py-0.5 rounded">C:2回目</span>';
      if (key === 'D') return '<span class="bg-purple-600 text-white font-bold text-[10px] px-1.5 py-0.5 rounded">D:3回目</span>';
      if (key === 'OTHER') return '<span class="bg-blue-600 text-white font-bold text-[10px] px-1.5 py-0.5 rounded">その他</span>';
      return '';
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
